<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salas Vazias — Anfiteatros ICC/UnB</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card2: #21252e;
    --border: #2d323d;
    --text: #e8eaed;
    --muted: #9aa0ab;
    --green: #34d17b;
    --green-dim: rgba(52, 209, 123, 0.12);
    --red: #f0625d;
    --red-dim: rgba(240, 98, 93, 0.10);
    --accent: #6c8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  .container { max-width: 720px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 22px; }
  header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; }
  header p { color: var(--muted); font-size: 0.85rem; margin-top: 6px; }
  header p span { color: var(--accent); }

  .controls {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .controls label { color: var(--muted); font-size: 0.85rem; }
  input[type="time"] {
    background: var(--card2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 1.05rem;
    outline: none;
    font-variant-numeric: tabular-nums;
  }
  input[type="time"]:focus { border-color: var(--accent); }
  select {
    background: var(--card2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.95rem;
    outline: none;
  }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 11px 18px;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.15s;
  }
  button:hover { filter: brightness(1.12); }
  button:disabled { opacity: 0.5; cursor: default; }
  .now-btn { background: var(--card2); border: 1px solid var(--border); color: var(--text); }

  .status-line {
    color: var(--muted);
    font-size: 0.82rem;
    min-height: 1.2em;
    margin: 10px 2px 16px;
  }
  .status-line.error { color: var(--red); }

  .summary {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
  }
  .summary .pill {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    text-align: center;
  }
  .pill .num { font-size: 1.7rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pill .lab { color: var(--muted); font-size: 0.78rem; margin-top: 2px; }
  .pill.livre .num { color: var(--green); }
  .pill.ocupada .num { color: var(--red); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
  }
  .room {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    border-left-width: 4px;
  }
  .room.livre { border-left-color: var(--green); }
  .room.ocupada { border-left-color: var(--red); }
  .room .name { font-weight: 700; font-size: 1.05rem; }
  .room .badge {
    font-size: 0.75rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    width: fit-content;
    padding: 3px 9px;
    border-radius: 20px;
  }
  .room.livre .badge { color: var(--green); background: var(--green-dim); }
  .room.ocupada .badge { color: var(--red); background: var(--red-dim); }
  .room.semdados { border-left-color: var(--muted); }
  .room.semdados .badge { color: var(--muted); background: rgba(154, 160, 171, 0.12); }
  .room .info { color: var(--muted); font-size: 0.78rem; line-height: 1.45; }
  .room .info b { color: var(--text); font-weight: 600; }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.75rem;
    margin-top: 28px;
    line-height: 1.6;
  }
  .spin {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid var(--muted);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: -2px;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🪑 Salas Vazias — Anfiteatros</h1>
    <p>Dados em tempo real do sistema de salas da <span>UnB</span></p>
  </header>

<div class="controls">
    <label for="hora">Horário:</label>
    <input type="time" id="hora" value="08:00">
<select id="dia" aria-label="Dia da semana">
      <option value="hoje" selected>Hoje</option>
      <option value="2">Segunda-feira</option>
      <option value="3">Terça-feira</option>
      <option value="4">Quarta-feira</option>
      <option value="5">Quinta-feira</option>
      <option value="6">Sexta-feira</option>
      <option value="7">Sábado</option>
    </select>
    <button class="now-btn" id="btnAgora">🕐 Agora</button>
    <button class="now-btn" id="btnAtualizar"
      title="Ignora o cache e consulta a API de novo">🔄 Atualizar</button>
    <button id="btnConsultar">Consultar</button>
</div>

  <div class="status-line" id="status"></div>

  <div class="summary">
    <div class="pill livre"><div class="num" id="nLivre">–</div><div class="lab">Vazias</div></div>
    <div class="pill ocupada"><div class="num" id="nOcup">–</div><div class="lab">Ocupadas</div></div>
  </div>

  <div class="grid" id="grid"></div>

  <footer>
    Fonte: servicos.unb.br/solicitasaladeaula (agenda semanal pública).<br>
    Salas Anf09 (indisponível) e Anf10 ainda não incluídas.
  </footer>
</div>

<script>
// idLocal confirmados na API da UnB
const SALAS = [
  { id: 159,     nome: 'Anf16' },
  { id: 141,     nome: 'Anf15' },
  { id: 132,     nome: 'Anf14' },
  { id: 124,     nome: 'Anf13' },
  { id: 183267,  nome: 'Anf12' },
  { id: 108,     nome: 'Anf11' },
  { id: 86,      nome: 'Anf08' },
  { id: 78,      nome: 'Anf07' },
  { id: 60,      nome: 'Anf06' },
  { id: 51,      nome: 'Anf05' },
  { id: 43,      nome: 'Anf04' },
  { id: 35,      nome: 'Anf03' },
  { id: 27,      nome: 'Anf02' },
];

const API = 'https://servicos.unb.br/agenda-api/relatorio/agenda-local?id=';
const DIAS_SEMANA = { 2: 'Segunda', 3: 'Terça', 4: 'Quarta', 5: 'Quinta', 6: 'Sexta', 7: 'Sábado' };

// A agenda é da UnB: "hoje", "agora" e a validade do cache seguem sempre o
// fuso de Brasília, nunca o do navegador de quem acessa.
const TZ = 'America/Sao_Paulo';
const fmtPartesBrasilia = new Intl.DateTimeFormat('pt-BR', {
  timeZone: TZ,
  year: 'numeric', month: '2-digit', day: '2-digit',
  hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
});
const fmtDiaLongoBrasilia = new Intl.DateTimeFormat('pt-BR', {
  timeZone: TZ, weekday: 'long', day: '2-digit', month: '2-digit',
});

// Fonte única de tempo: quebra um instante (por padrão, agora) nas partes do
// fuso de Brasília. Receber o Date de fora permite que quem precisa de duas
// leituras coerentes (dia + texto do dia) use o mesmo instante.
function agoraBrasilia(instante = new Date()) {
  const p = {};
  for (const { type, value } of fmtPartesBrasilia.formatToParts(instante)) p[type] = value;
  return {
    dia: parseInt(p.day, 10),
    mes: parseInt(p.month, 10),
    ano: parseInt(p.year, 10),
    hora: parseInt(p.hour, 10),
    minuto: parseInt(p.minute, 10),
  };
}

// JS: 0=dom..6=sab — calculado a partir da data de Brasília, sem depender de
// nomes de dia localizados.
function diaSemanaDe(partes) {
  return new Date(Date.UTC(partes.ano, partes.mes - 1, partes.dia)).getUTCDay();
}

function diaSemanaAgora() {
  return diaSemanaDe(agoraBrasilia());
}

function horaAgoraBrasilia() {
  const { hora, minuto } = agoraBrasilia();
  return String(hora).padStart(2, '0') + ':' + String(minuto).padStart(2, '0');
}

// Identificador do dia corrente em Brasília — é a chave de validade do cache
// (a agenda é semanal, então vale só para o dia em que foi buscada).
function chaveDiaBrasilia(instante = new Date()) {
  const { dia, mes, ano } = agoraBrasilia(instante);
  return ano + '-' + mes + '-' + dia;
}

const grid = document.getElementById('grid');
const statusEl = document.getElementById('status');
const horaInput = document.getElementById('hora');
const diaSelect = document.getElementById('dia');
const btnConsultar = document.getElementById('btnConsultar');
const btnAgora = document.getElementById('btnAgora');
const btnAtualizar = document.getElementById('btnAtualizar');

// Cache das agendas por sala. A agenda é semanal, mas reservas podem entrar a
// qualquer momento: cada entrada guarda o instante em que foi buscada e vale
// por TTL_CACHE_MS. Passado o prazo, a sala é consultada de novo.
const cacheAgendas = { __dia: null }; // id -> { d, em }
const TTL_CACHE_MS = 60000;

// Requisições em andamento, por id: consultas sobrepostas reaproveitam o mesmo
// fetch em vez de baixar a mesma sala duas vezes.
const requisicoesEmVoo = {};

const TIMEOUT_FETCH_MS = 12000;

function limparCacheSeNovoDia() {
  const chave = chaveDiaBrasilia();
  if (cacheAgendas.__dia !== chave) {
    for (const k of Object.keys(cacheAgendas)) delete cacheAgendas[k];
    for (const k of Object.keys(requisicoesEmVoo)) delete requisicoesEmVoo[k];
    cacheAgendas.__dia = chave;
  }
}

function cacheAindaVale(sala, forcar) {
  if (forcar) return false;
  const e = cacheAgendas[sala.id];
  return !!e && (Date.now() - e.em) < TTL_CACHE_MS;
}

// idade do dado mais antigo entre as salas efetivamente exibidas, em ms: deixa
// visível no status que a tela pode estar desatualizada
function idadeDoDado(resultados) {
  let maisAntigo = 0;
  const agora = Date.now();
  for (const r of resultados) {
    if (r.erro) continue; // sala sem resposta não exibe dado
    const e = cacheAgendas[r.id];
    if (e) maisAntigo = Math.max(maisAntigo, agora - e.em);
  }
  return maisAntigo;
}

function idadeTexto(ms) {
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 60) return 'há ' + s + 's';
  return 'há ' + Math.round(s / 60) + 'min';
}

// "08:00h - 08:55h" => {ini: 480, fim: 535} (minutos)
function parseLabel(label) {
  if (typeof label !== 'string') return null;
  const m = label.match(/(\d{1,2}):(\d{2})\s*h?\s*-\s*(\d{1,2}):(\d{2})/);
  if (!m) return null;
  return {
    ini: parseInt(m[1]) * 60 + parseInt(m[2]),
    fim: parseInt(m[3]) * 60 + parseInt(m[4]),
  };
}

function hmParaMin(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  return h * 60 + m;
}

// Formato que o <input type="time"> entrega (e que o resto do script espera).
const RE_HORA = /^([01]\d|2[0-3]):[0-5]\d$/;

// Um fetch da API, com timeout: sem ele uma API pendurada deixaria o spinner
// e os botões travados indefinidamente.
async function buscarAgenda(sala) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TIMEOUT_FETCH_MS);
  try {
    const r = await fetch(API + sala.id, { signal: ctrl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    // Envelope da API: { success, status, error, message, data }. Uma falha de
    // backend pode vir com HTTP 200: isso é erro e não pode ser cacheado como
    // se fosse "sala sem agenda" (senão a sala só seria reconsultada amanhã).
    if (!j || typeof j !== 'object') throw new Error('resposta inesperada');
    if (j.success === false) throw new Error(j.error || j.message || 'success=false');
    const d = j.data;
    if (Array.isArray(d)) return d[0] || null;
    if (d && typeof d === 'object') return d;
    return null;
  } catch (e) {
    if (e && e.name === 'AbortError') throw new Error('tempo esgotado (' + TIMEOUT_FETCH_MS + ' ms)');
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

async function carregarSala(sala, forcar = false, tentativas = 1) {
  limparCacheSeNovoDia();
  const chaveDia = cacheAgendas.__dia; // dia em que esta busca começou
  if (cacheAindaVale(sala, forcar)) return cacheAgendas[sala.id].d;

  // requisição em voo é fresca por definição: pode ser reaproveitada mesmo
  // quando o usuário pediu atualização forçada
  let emVoo = requisicoesEmVoo[sala.id];
  const dono = !emVoo;
  if (dono) {
    emVoo = (async () => {
      const d = await buscarAgenda(sala);
      // Só grava se o dia não virou durante o fetch: uma resposta começada na
      // semana anterior não pode ser cacheada como se fosse da semana atual.
      if (chaveDiaBrasilia() === chaveDia) cacheAgendas[sala.id] = { d, em: Date.now() };
      return d;
    })();
    requisicoesEmVoo[sala.id] = emVoo;
  }

  let dados;
  try {
    dados = await emVoo;
  } finally {
    if (dono && requisicoesEmVoo[sala.id] === emVoo) delete requisicoesEmVoo[sala.id];
  }

  // O dia virou no meio da busca, inclusive quando esta chamada apenas
  // reaproveitou uma requisição pendente de outra consulta: descarta o
  // resultado e busca de novo sob a chave nova, uma única vez.
  if (chaveDiaBrasilia() !== chaveDia) {
    return tentativas > 0 ? carregarSala(sala, forcar, tentativas - 1) : dados;
  }
  return dados;
}

// d = {dia2..dia7}; devolve as aulas do dia escolhido, quantos itens têm
// horário fora do padrão e se o dado do dia veio em formato inesperado
// (dia ausente = sala sem aulas naquele dia; dia presente e ilegível =
// não dá para afirmar que a sala está vazia).
function aulasDoDia(d, diaSemana) {
  if (!d) return { aulas: [], ignorados: 0, invalido: false };
  if (typeof d !== 'object') return { aulas: [], ignorados: 0, invalido: true };
  const doDia = d['dia' + diaSemana];
  if (doDia == null) return { aulas: [], ignorados: 0, invalido: false };
  if (!Array.isArray(doDia)) return { aulas: [], ignorados: 0, invalido: true };
  let ignorados = 0;
  const aulas = [];
  for (const item of doDia) {
    const label = item && typeof item.label === 'string' ? item.label : '';
    const faixa = parseLabel(label);
    if (!faixa) { ignorados++; continue; }
    aulas.push({ ini: faixa.ini, fim: faixa.fim, turma: item && item.turma, label });
  }
  return { aulas, ignorados, invalido: false };
}

// A API devolve as reservas na ordem de cadastro, não por horário, e quebra
// toda aula de 2 créditos em dois registros seguidos (08:00-08:55 e
// 08:55-09:50). Sem ordenar e sem fundir os pedaços da mesma turma, o card
// anuncia a sala livre no meio da aula.
function consolidarReservas(aulas) {
  const porTurma = new Map();
  for (const a of aulas) {
    const chave = String(a.turma == null ? '' : a.turma);
    const lista = porTurma.get(chave) || [];
    lista.push(a);
    porTurma.set(chave, lista);
  }
  const saida = [];
  for (const lista of porTurma.values()) {
    lista.sort((x, y) => x.ini - y.ini || x.fim - y.fim);
    let atual = null;
    for (const a of lista) {
      if (atual && a.ini <= atual.fim) {
        // encadeia o próximo pedaço da mesma turma (ou funde duplicatas)
        atual.fim = Math.max(atual.fim, a.fim);
        atual.registros++;
      } else {
        atual = { ini: a.ini, fim: a.fim, turma: a.turma, registros: 1 };
        saida.push(atual);
      }
    }
  }
  saida.sort((x, y) => x.ini - y.ini || y.fim - x.fim);
  return saida;
}

// Reservas que cobrem o minuto consultado: pode haver mais de uma ao mesmo
// tempo (turmas conjuntas, evento sobrepondo aulas).
function reservasNoHorario(reservas, minutos) {
  return reservas.filter(a => minutos >= a.ini && minutos < a.fim);
}

// Fim da sequência contínua de reservas a partir do minuto consultado: a sala
// pode seguir ocupada depois do fim da reserva que está na tela, porque outra
// começa exatamente quando esta termina.
function fimDoBloco(reservas, minutos) {
  let fim = minutos;
  let avancou = true;
  while (avancou) {
    avancou = false;
    for (const a of reservas) {
      if (a.ini <= fim && a.fim > fim) { fim = a.fim; avancou = true; }
    }
  }
  return fim;
}

function fmtMin(minutos) {
  return String(Math.floor(minutos / 60)).padStart(2, '0') + ':'
    + String(minutos % 60).padStart(2, '0');
}

// "08:00h - 09:50h", no mesmo formato dos rótulos da API
function faixaTexto(ini, fim) {
  return fmtMin(ini) + 'h - ' + fmtMin(fim) + 'h';
}

// Lê o horário do campo sem nunca reescrevê-lo. O picker nativo permite
// apagar o campo (no WebKit ele fica vazio enquanto o usuário digita), e
// substituir o que está escrito pelo horário de agora é pior do que não
// consultar: quem chama decide o que fazer quando vier null.
function horarioDoCampo() {
  const valor = String(horaInput.value || '').trim();
  return RE_HORA.test(valor) ? valor : null;
}

function avisarHorarioIncompleto() {
  statusEl.className = 'status-line';
  statusEl.textContent = 'Horário incompleto — informe HH:MM ou toque em «Agora».';
}

// Monta o cartão de uma sala e informa o estado apurado: erro | semdados |
// invalido | ilegivel | ocupada | livre.
function cartaoDaSala(r, diaSemana, minutos) {
  const div = document.createElement('div');
  const nome = escapeHtml(r.nome);

  // falha de rede: a sala não some da grade, aparece marcada com o erro
  if (r.erro) {
    div.className = 'room semdados';
    div.innerHTML = `
      <div class="name">${nome}</div>
      <div class="badge">– Sem resposta</div>
      <div class="info">A API não respondeu para esta sala (${escapeHtml(r.erro)}).</div>`;
    return { div, estado: 'erro' };
  }

  const { aulas, ignorados, invalido } = aulasDoDia(r.dados, diaSemana);

  // sala sem agenda: estado próprio, fora da contagem de vazias/ocupadas
  if (r.dados == null) {
    div.className = 'room semdados';
    div.innerHTML = `
      <div class="name">${nome}</div>
      <div class="badge">– Sem dados</div>
      <div class="info">Agenda indisponível para esta sala.</div>`;
    return { div, estado: 'semdados' };
  }

  // resposta em formato inesperado (ex.: dia2 como texto, ou a agenda inteira
  // como string): não se pode afirmar que a sala está vazia
  if (invalido) {
    div.className = 'room semdados';
    div.innerHTML = `
      <div class="name">${nome}</div>
      <div class="badge">– Dados inválidos</div>
      <div class="info">A agenda desta sala veio em formato inesperado; disponibilidade não confirmada.</div>`;
    return { div, estado: 'invalido' };
  }

  const reservas = consolidarReservas(aulas);
  const cobrindo = reservasNoHorario(reservas, minutos);
  // com reservas simultâneas, manda a que segura a sala por mais tempo
  const principal = cobrindo.reduce(
    (melhor, a) => (melhor === null || a.fim > melhor.fim) ? a : melhor, null);
  const prox = principal ? null : (reservas.find(a => a.ini >= minutos) || null);

  // há reserva com horário ilegível e nada ocupando agora: a disponibilidade
  // não pode ser afirmada, então vira estado próprio, fora da contagem
  if (!principal && ignorados > 0) {
    div.className = 'room semdados';
    div.innerHTML = `
      <div class="name">${nome}</div>
      <div class="badge">– Horário ilegível</div>
      <div class="info">Há reserva com horário fora do padrão; disponibilidade não confirmada.</div>`;
    return { div, estado: 'ilegivel' };
  }

  let info;
  if (principal) {
    const fim = fimDoBloco(reservas, minutos);
    info = `<b>${escapeHtml(principal.turma || 'Aula')}</b><br>`
      + faixaTexto(principal.ini, principal.fim);
    if (principal.registros > 1) info += ` (${principal.registros} aulas)`;
    if (fim > principal.fim) info += `<br>Ocupada até ${fmtMin(fim)}`;
    if (cobrindo.length > 1) info += `<br>(+${cobrindo.length - 1} reserva(s) no mesmo horário)`;
  } else if (prox) {
    info = `Próxima aula: <b>${escapeHtml(prox.turma || 'Turma não especificada')}</b><br>`
      + faixaTexto(prox.ini, prox.fim);
    const simultaneas = reservas.filter(a => a.ini === prox.ini).length;
    if (simultaneas > 1) info += `<br>(+${simultaneas - 1} no mesmo horário)`;
  } else {
    info = 'Livre até o fim do dia ✓';
  }

  div.className = 'room ' + (principal ? 'ocupada' : 'livre');
  div.innerHTML = `
    <div class="name">${nome}</div>
    <div class="badge">${principal ? '● Ocupada' : '○ Vazia'}</div>
    <div class="info">${info}</div>`;
  return { div, estado: principal ? 'ocupada' : 'livre' };
}

function render(resultados, diaSemana, minutos) {
  grid.innerHTML = '';
  let livres = 0, ocupadas = 0, semDados = 0, incompletos = 0, erros = 0;

  for (const r of resultados) {
    let cartao;
    try {
      cartao = cartaoDaSala(r, diaSemana, minutos);
    } catch (e) {
      // uma sala com dado bizarro não pode derrubar a exibição das demais
      const div = document.createElement('div');
      div.className = 'room semdados';
      div.innerHTML = `
        <div class="name">${escapeHtml(r.nome)}</div>
        <div class="badge">– Não foi possível ler</div>
        <div class="info">A agenda desta sala não pôde ser interpretada.</div>`;
      cartao = { div, estado: 'invalido' };
    }
    grid.appendChild(cartao.div);
    if (cartao.estado === 'erro') erros++;
    else if (cartao.estado === 'semdados') semDados++;
    else if (cartao.estado === 'invalido' || cartao.estado === 'ilegivel') incompletos++;
    else if (cartao.estado === 'ocupada') ocupadas++;
    else livres++;
  }

  document.getElementById('nLivre').textContent = livres;
  document.getElementById('nOcup').textContent = ocupadas;
  return { semDados, incompletos, erros };
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Token da consulta em curso: se o usuário disparar outra consulta antes da
// anterior terminar, a anterior se torna obsoleta e não pode mais renderizar
let consultaSeq = 0;

// Quantas consultas estão em andamento, automáticas inclusive: o relógio ao
// vivo não começa outra por cima de uma consulta disparada pelo usuário.
let consultasEmAndamento = 0;

// Modo "agora": a tela acompanha o relógio e se atualiza sozinha. Qualquer
// escolha explícita (outro dia, outro horário) desliga o modo, para a seleção
// do usuário nunca ser sobrescrita pelo tique automático.
let seguindoAgora = true;

// Horário dos cartões em exibição. Se uma atualização automática falhar, o
// campo volta para ele: um horário novo ao lado de cartões calculados para
// outra hora seria pior do que um minuto de atraso.
let horaRenderizada = null;

// Depois de uma falha da atualização automática, espera antes de tentar de
// novo: sem isso cada tique repetiria as 13 requisições enquanto a API
// estivesse fora do ar.
let bloqueioAoVivoAte = 0;

// Ritmo do relógio ao vivo e espera depois de uma falha automática.
const INTERVALO_AO_VIVO_MS = 15000;
const ESPERA_APOS_FALHA_MS = 60000;

async function consultar(forcar = false, tentativasDia = 1, modo = {}) {
  // Atualização automática: não mexe nos controles nem anuncia "consultando"
  // a cada minuto — o painel só troca os cartões quando os dados chegam.
  const silencioso = modo.silencioso === true;

  // Campo vazio/incompleto: não inventa um horário (isso apagaria o que o
  // usuário está digitando) e não consulta nada.
  const hhmm = horarioDoCampo();
  if (hhmm === null) {
    if (!silencioso) avisarHorarioIncompleto();
    return;
  }

  const seq = ++consultaSeq;
  consultasEmAndamento++;

  // Um único instante para tudo (dia consultado, texto do dia e chave do
  // cache): o relógio pode cruzar a meia-noite no meio da consulta.
  const instanteEmissao = new Date();
  const chaveEmissao = chaveDiaBrasilia(instanteEmissao);
  const diaTextoHoje = fmtDiaLongoBrasilia.format(instanteEmissao);

  // Seleção e horário ficam congelados aqui: o usuário pode mexer nos
  // controles com os fetches em voo, e o status tem de descrever o que foi
  // consultado, não o que estiver selecionado quando a resposta chegar.
  const selecao = diaSelect.value;
  const minutos = hmParaMin(hhmm);

  // Botões desabilitados antes de qualquer caminho de saída: o finally abaixo
  // é o único lugar que os reabilita, inclusive no ramo de domingo. No modo
  // silencioso nada disso acontece — um tique automático não pode engolir um
  // clique do usuário nem piscar o spinner a cada minuto.
  if (!silencioso) {
    btnConsultar.disabled = true;
    btnAgora.disabled = true;
    btnAtualizar.disabled = true;
    statusEl.className = 'status-line';
    statusEl.innerHTML = '<span class="spin"></span>'
      + (forcar ? 'Atualizando' : 'Consultando') + ' ' + SALAS.length + ' salas...';
  }

  try {
    // página aberta desde ontem: o rótulo de "Hoje" tem de acompanhar o dia
    atualizarOpcoesDia();

    let diaSemana;
    if (selecao === 'hoje') {
      // JS: 0=dom..6=sab ; API: 2=seg .. 7=sab
      const js = diaSemanaDe(agoraBrasilia(instanteEmissao));
      if (js === 0) {
        // domingo: sem aulas na semana, estado explícito em vez de "tudo vazio"
        // (dentro do try/finally: os botões sempre voltam a funcionar)
        if (seq !== consultaSeq) return;
        grid.innerHTML = '';
        document.getElementById('nLivre').textContent = '–';
        document.getElementById('nOcup').textContent = '–';
        statusEl.className = 'status-line';
        statusEl.textContent = 'Hoje é domingo — não há aulas nos anfiteatros.';
        horaRenderizada = hhmm;
        bloqueioAoVivoAte = 0;
        return;
      }
      diaSemana = js + 1;
    } else {
      diaSemana = parseInt(selecao, 10);
    }

    // allSettled: falha em uma sala não derruba a consulta das demais
    const settled = await Promise.allSettled(
      SALAS.map(async s => ({ ...s, dados: await carregarSala(s, forcar) })));

    const resultados = [];
    let erros = 0;
    let motivo = '';
    SALAS.forEach((sala, i) => {
      const r = settled[i];
      if (r.status === 'fulfilled') {
        resultados.push(r.value);
      } else {
        erros++;
        const msg = (r.reason && r.reason.message) || 'sem resposta';
        if (!motivo) motivo = msg;
        // a sala não desaparece da grade: o card dela mostra o erro
        resultados.push({ ...sala, dados: null, erro: msg });
      }
    });
    if (erros === SALAS.length) {
      throw new Error(erros + ' salas sem resposta'
        + (motivo ? ': ' + motivo : ' (API indisponível?)'));
    }
    if (seq !== consultaSeq) return; // uma consulta mais nova assumiu

    // Virou o dia durante a consulta: "hoje" agora é outro dia, então refaz do
    // zero com o dia novo (uma vez) em vez de misturar dia e dados.
    if (selecao === 'hoje' && chaveDiaBrasilia() !== chaveEmissao) {
      if (tentativasDia > 0) return consultar(forcar, tentativasDia - 1, modo);
    }

    // o retrato exibido passa a ser este: é para cá que o campo volta se uma
    // atualização automática falhar
    horaRenderizada = hhmm;
    bloqueioAoVivoAte = 0;

    const diaTxt = selecao === 'hoje' ? diaTextoHoje : DIAS_SEMANA[diaSemana];
    const contagem = render(resultados, diaSemana, minutos);
    let txt = `Agenda de ${diaTxt} às ${hhmm} — ${SALAS.length} salas`;
    if (contagem.erros) txt += ` · ${contagem.erros} sem resposta`;
    if (contagem.semDados) txt += ` · ${contagem.semDados} sem dados`;
    if (contagem.incompletos) txt += ` · ⚠ ${contagem.incompletos} sala(s) com dados incompletos`;
    // transparência: quanto tempo faz que estes dados saíram da API
    const idade = idadeDoDado(resultados);
    if (idade >= 5000) txt += ` · ${idadeTexto(idade)}`;
    statusEl.className = 'status-line';
    statusEl.textContent = txt;
  } catch (e) {
    if (seq !== consultaSeq) return; // obsoleta: não sobrescreve a consulta atual
    if (silencioso) {
      // falha passageira não pode apagar a tela que já estava correta
      if (horaRenderizada) horaInput.value = horaRenderizada;
      bloqueioAoVivoAte = Date.now() + ESPERA_APOS_FALHA_MS;
      statusEl.className = 'status-line error';
      statusEl.textContent = 'Falha ao atualizar automaticamente (' + e.message
        + '). A tela mantém a última consulta.';
      return;
    }
    // resultados antigos não podem ficar na tela: pareceriam atuais
    grid.innerHTML = '';
    document.getElementById('nLivre').textContent = '–';
    document.getElementById('nOcup').textContent = '–';
    statusEl.className = 'status-line error';
    statusEl.textContent = 'Erro ao consultar a API da UnB: ' + e.message;
  } finally {
    consultasEmAndamento--;
    if (!silencioso && seq === consultaSeq) {
      btnConsultar.disabled = false;
      btnAgora.disabled = false;
      btnAtualizar.disabled = false;
    }
  }
}

// "Agora" liga o modo ao vivo. Uma escolha manual o desliga, mas um horário
// que coincide com o relógio (e "Hoje") continua sendo "agora".
function sincronizarModoAgora() {
  const valor = String(horaInput.value || '');
  seguindoAgora = diaSelect.value === 'hoje' && RE_HORA.test(valor)
    && valor === horaAgoraBrasilia();
}

btnAgora.addEventListener('click', () => {
  horaInput.value = horaAgoraBrasilia();
  diaSelect.value = 'hoje';
  atualizarOpcoesDia();
  seguindoAgora = true;
  consultar();
});
btnConsultar.addEventListener('click', () => {
  sincronizarModoAgora();
  consultar();
});
btnAtualizar.addEventListener('click', () => {
  sincronizarModoAgora();
  consultar(true);
});
horaInput.addEventListener('change', () => {
  sincronizarModoAgora();
  consultar();
});
diaSelect.addEventListener('change', () => {
  sincronizarModoAgora();
  atualizarOpcoesDia();
  consultar();
});

// O painel nascia "agora" e ficava parado: às 09:55 ainda mostrava a aula que
// acabava às 09:50 e só um F5 acertava a tela. Este tique só age quando a tela
// acompanha o relógio (modo ao vivo), uma vez por minuto que vira, e é
// silencioso: sem spinner, sem botões travados e sem sobrescrever a seleção de
// quem escolheu outro dia/horário.
function tiqueAoVivo() {
  // Aba em segundo plano (celular bloqueado, outra aba): não gasta rede nem
  // bateria. Ao voltar, o visibilitychange abaixo recupera o relógio na hora.
  if (document.hidden) return;
  // o rótulo "Hoje · <dia>" e a opção duplicada precisam acompanhar a virada
  // também para quem está no modo manual (ex.: horário escolhido, dia "Hoje")
  atualizarOpcoesDia();
  if (!seguindoAgora || diaSelect.value !== 'hoje') return;
  // O usuário está digitando no campo: o relógio não compete com ele.
  if (document.activeElement === horaInput) return;
  if (consultasEmAndamento > 0) return;
  if (Date.now() < bloqueioAoVivoAte) return;

  const agora = horaAgoraBrasilia();
  if (agora === horaInput.value) return; // mesmo minuto: nada mudou
  horaInput.value = agora;
  consultar(false, 1, { silencioso: true });
}

setInterval(tiqueAoVivo, INTERVALO_AO_VIVO_MS);
document.addEventListener('visibilitychange', () => {
  // a aba voltou: o relógio pode ter andado enquanto os timers estavam parados
  if (!document.hidden) tiqueAoVivo();
});

// Reflete o dia corrente no seletor: com "Hoje" selecionado, o rótulo mostra
// o dia real ("Hoje · Sexta") e a opção duplicada desse mesmo dia sai da lista.
// Ao selecionar um dia específico, "Hoje" volta ao rótulo simples.
//
// O picker nativo do WebKit (Safari e todo navegador no iOS/iPadOS) ignora
// option.hidden e option { display: none }: a única forma confiável de não
// duplicar o dia de hoje é remover o nó <option> do DOM, o que exige remontar
// a lista quando o dia ou a seleção mudam.
const DIAS_OPCOES = [
  { valor: '2', texto: 'Segunda-feira' },
  { valor: '3', texto: 'Terça-feira' },
  { valor: '4', texto: 'Quarta-feira' },
  { valor: '5', texto: 'Quinta-feira' },
  { valor: '6', texto: 'Sexta-feira' },
  { valor: '7', texto: 'Sábado' },
];

// Última combinação (dia + seleção) que montou a lista. Remontar a cada
// consulta fecharia o picker nativo aberto — e no modo ao vivo isso
// aconteceria a cada minuto.
let chaveOpcoesDia = null;

function atualizarOpcoesDia() {
  const js = diaSemanaAgora();
  const selecionadoHoje = diaSelect.value === 'hoje';
  const diaDeHoje = js === 0 ? null : String(js + 1);
  const selecaoAtual = diaSelect.value;
  const chave = chaveDiaBrasilia() + '|' + selecaoAtual;
  if (chave === chaveOpcoesDia) return;
  chaveOpcoesDia = chave;

  diaSelect.innerHTML = '';

  const opHoje = document.createElement('option');
  opHoje.value = 'hoje';
  opHoje.textContent = selecionadoHoje
    ? (js === 0 ? 'Hoje (domingo)' : 'Hoje · ' + DIAS_SEMANA[js + 1])
    : 'Hoje';
  diaSelect.appendChild(opHoje);

  for (const d of DIAS_OPCOES) {
    // com "Hoje" selecionado, o dia de hoje não deve aparecer duas vezes
    if (selecionadoHoje && d.valor === diaDeHoje) continue;
    const op = document.createElement('option');
    op.value = d.valor;
    op.textContent = d.texto;
    diaSelect.appendChild(op);
  }

  // a opção "hoje" existe sempre, então a seleção não se perde
  diaSelect.value = selecaoAtual || 'hoje';
}

// começa no horário atual
(function init() {
  horaInput.value = horaAgoraBrasilia();
  atualizarOpcoesDia();
  consultar();
})();
</script>
</body>
</html>
